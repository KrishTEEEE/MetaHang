<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FaceHangout</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0b0d12;
        color: #e8ecf4;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      canvas#view { display: block; width: 100vw; height: 100vh; }

      /* Hidden capture elements — never shown, only read by MediaPipe / WebGL. */
      #cam, #faceframe { position: absolute; left: -9999px; top: -9999px; }

      #hud {
        position: fixed; top: 12px; left: 12px;
        background: rgba(12, 15, 22, 0.82);
        border: 1px solid #232a38; border-radius: 8px;
        padding: 10px 12px; min-width: 210px;
        backdrop-filter: blur(8px);
      }
      #hud h1 { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #7c8798; margin-bottom: 8px; font-weight: 600; }
      #hud .row { display: flex; justify-content: space-between; gap: 16px; }
      #hud .k { color: #7c8798; }
      #hud .v { color: #e8ecf4; }
      .state-LIVE { color: #4ade80 !important; }
      .state-HELD { color: #fbbf24 !important; }
      .state-AFK  { color: #f87171 !important; }

      #overlay {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #0b0d12; z-index: 10; text-align: center; padding: 24px;
      }
      #overlay.hidden { display: none; }
      #overlay .box { max-width: 460px; }
      #overlay h2 { font-size: 20px; margin-bottom: 12px; font-weight: 600; }
      #overlay p { color: #98a2b3; margin-bottom: 20px; }
      #overlay button {
        background: #3b82f6; color: white; border: 0; border-radius: 6px;
        padding: 10px 22px; font: inherit; font-weight: 600; cursor: pointer;
      }
      #overlay button:hover { background: #2563eb; }
      #overlay button:disabled { background: #2a3240; color: #667085; cursor: default; }
      #err { color: #f87171; margin-top: 14px; white-space: pre-wrap; text-align: left; }
      #status { color: #e8ecf4; min-height: 20px; }
      #bar { display: none; height: 4px; background: #232a38; border-radius: 2px; margin-top: 12px; overflow: hidden; }
      #bar.on { display: block; }
      #bar i { display: block; height: 100%; width: 0%; background: #4ade80; transition: width 120ms linear; }

      #help {
        position: fixed; bottom: 12px; left: 12px;
        color: #667085; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="faceframe"></canvas>

    <div id="hud">
      <h1>FaceHangout</h1>
      <div class="row"><span class="k">face</span><span class="v" id="hud-state">—</span></div>
      <div class="row"><span class="k">fps</span><span class="v" id="hud-fps">—</span></div>
      <div class="row"><span class="k">peers</span><span class="v" id="hud-peers">—</span></div>
      <div class="row"><span class="k">net</span><span class="v" id="hud-net">—</span></div>
    </div>

    <div id="help">WASD move &nbsp;·&nbsp; hold right-click to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; C recalibrate</div>

    <div id="overlay">
      <div class="box">
        <h2>FaceHangout</h2>
        <p>
          Your webcam feed is mapped onto a 3D head shaped from your own face.
          Nothing is recorded; frames go only to others in your room.
        </p>
        <button id="start">Enable camera</button>
        <div id="status"></div>
        <div id="bar"><i></i></div>
        <div id="err"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
